[project]
name = "rick-downloader-worker"
version = "0.1.0"
description = "Rick-downloader worker: scanning, downloading and file I/O (FastAPI + yt-dlp library)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "httpx>=0.28",
    "selectolax>=0.3.27",
    "pydantic-settings>=2.6",
    # Pinned on purpose (spec §9.5). Upgrade: uv lock --upgrade-package yt-dlp (see README).
    "yt-dlp==2026.10.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-bandit]
# Spec §9.1: no subprocess / os.system / shell=True anywhere in the worker.
# S6xx rules flag these; they stay enabled (default).

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*", "selectolax", "selectolax.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
